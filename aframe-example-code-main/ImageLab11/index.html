<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item
          id="pokeball"
          src="assets/Part Studio 1 - Part 1.obj"
        ></a-asset-item>
        <a-asset-item
          id="pokeballmtl"
          src="assets/Part Studio 1 - Part 1.mtl"
        ></a-asset-item>
        <a-asset-item
          id="charmander"
          src="assets/charmander.obj"
        ></a-asset-item>
      </a-assets>
      <a-obj-model
        src="#pokeball"
        mtl="#pokeballmtl"
        id="pkball1"
        color="orange"
      ></a-obj-model>
      <a-camera>
        <a-cursor color="#000000"></a-cursor>
      </a-camera>
    </a-scene>
    <script src="script.js"></script>
  </body>
</html>
